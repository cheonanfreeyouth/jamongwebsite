<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유계몽청년단</title>
    <link rel="icon" href="image/IMG_3595.jpeg" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; /* 스크롤 없이 한 화면에 꽉 차게 */
        }

        /* 배경 이미지 레이어: 여러 장을 격자로 배치 */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            filter: brightness(0.3); /* 민준 님이 원한 '밝기 낮추기' 핵심! */
            z-index: 1;
        }

        .bg-overlay img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 중앙 콘텐츠 레이어 */
        .content {
            position: relative;
            z-index: 2; /* 배경보다 위로 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.2); /* 글자 가독성을 위해 살짝 어둡게 */
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            text-align: center;
        }

        .description {
            font-size: 1.2rem;
            line-height: 1.8;
            max-width: 600px;
            margin-bottom: 40px;
            color: #ddd;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        .back-btn {
            padding: 12px 40px;
            color: white;
            text-decoration: none;
            border: 1px solid white;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.1);
        }

        .back-btn:hover {
            background: white;
            color: black;
        }
        p{
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="bg-overlay">
        <img src="image/IMG_1340.jpg" alt="활동1">
    </div>

    <div class="content">
        <h1>우리들의 세미나</h1>
        <p class="description">
            저희는 세미나를 진행하고 있습니다 <br>자세한 정보는 메인 화면의 카카오톡 오픈채팅방에서 확인 가능합니다.
        </p>
        <a href="index.html" class="back-btn">메인으로 돌아가기</a>
    </div>

</body>
</html>
